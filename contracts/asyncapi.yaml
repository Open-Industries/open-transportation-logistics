asyncapi: 2.6.0
info:
  title: Open Transportation & Logistics — Reference Logistics Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.logistics.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  shipment.created:
    publish:
      operationId: on-shipment-created
      message: { $ref: '#/components/messages/Generic' }
  capacity.created:
    publish:
      operationId: on-capacity-created
      message: { $ref: '#/components/messages/Generic' }
  routing.created:
    publish:
      operationId: on-routing-created
      message: { $ref: '#/components/messages/Generic' }
  fleet.created:
    publish:
      operationId: on-fleet-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  shipmentrisk.evaluated:
    publish:
      operationId: on-shipmentrisk-evaluated
      message: { $ref: '#/components/messages/Generic' }
  logisticssla.evaluated:
    publish:
      operationId: on-logisticssla-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-transportation-logistics/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
